[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thegenie"
version = "0.1.0"
description = "Local MCP server that gives AI writing assistants verifiable, citable evidence from your own PDFs and checks every citation against the source before you trust it."
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "mcp",
  "pydantic-settings",
  "pymupdf",
  "qdrant-client",
  "sentence-transformers",
  "torch",
  "tqdm",
]

[project.scripts]
thegenie = "thegenie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thegenie"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
